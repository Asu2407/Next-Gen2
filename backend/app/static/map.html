<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SAHAYAK - Macro-Tactical Map</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Jetbrains+Mono:wght@400;500;700&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <!-- Leaflet CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        /* Leaflet custom map dark style overrides */
        .leaflet-container {
            background: #111318 !important;
        }
        .leaflet-bar {
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            background: rgba(17, 19, 24, 0.9) !important;
        }
        .leaflet-bar a {
            background: rgba(17, 19, 24, 0.9) !important;
            color: #ffb4a5 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .leaflet-bar a:hover {
            background: rgba(255, 180, 165, 0.2) !important;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        tertiary: "#47d6ff",
                        "on-primary-fixed": "#3e0400",
                        "on-tertiary-fixed-variant": "#004e60",
                        secondary: "#7dffa2",
                        "secondary-fixed": "#62ff96",
                        "secondary-fixed-dim": "#00e475",
                        "tertiary-fixed": "#b6ebff",
                        "inverse-surface": "#e2e2e8",
                        "on-tertiary-container": "#002e3a",
                        "primary-fixed": "#ffdad3",
                        "surface-container-low": "#1a1c20",
                        "surface-dim": "#111318",
                        outline: "#ac8981",
                        "surface-container-lowest": "#0c0e12",
                        "inverse-primary": "#ba1d00",
                        "on-primary": "#650b00",
                        "on-secondary": "#003918",
                        "on-secondary-fixed": "#00210b",
                        "inverse-on-surface": "#2f3035",
                        "error-container": "#93000a",
                        "surface-container-high": "#282a2e",
                        "on-secondary-container": "#00622e",
                        "surface-container": "#1e2024",
                        "tertiary-fixed-dim": "#47d6ff",
                        "secondary-container": "#05e777",
                        error: "#ff3b3b",
                        "surface-bright": "#37393e",
                        "on-surface": "#e2e2e8",
                        "on-background": "#e2e2e8",
                        "on-primary-container": "#580800",
                        "outline-variant": "#5c403a",
                        surface: "#111318",
                        "on-surface-variant": "#e5beb6",
                        "on-tertiary": "#003543",
                        primary: "#ffb4a5",
                        "primary-container": "#ff5637",
                        "primary-fixed-dim": "#ffb4a5",
                        "on-tertiary-fixed": "#001f28",
                        "on-error-container": "#ffdad6",
                        background: "#111318",
                        "tertiary-container": "#009ec0",
                        "on-secondary-fixed-variant": "#005226",
                        "on-primary-fixed-variant": "#8e1400",
                        "surface-variant": "#333539",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#333539",
                        "surface-tint": "#ffb4a5"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        xs: "4px",
                        "sidebar-width": "280px",
                        md: "16px",
                        lg: "24px",
                        sm: "8px",
                        xl: "48px",
                        "container-max": "1440px",
                        unit: "4px"
                    },
                    fontFamily: {
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["JetBrains Mono"],
                        "data-num": ["JetBrains Mono"],
                        "headline-md": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["JetBrains Mono"],
                        "label-caps": ["JetBrains Mono"],
                        headline: ["Jetbrains Mono"],
                        display: ["Jetbrains Mono"],
                        body: ["Inter"],
                        label: ["Jetbrains Mono"]
                    },
                    fontSize: {
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "data-num": ["20px", { lineHeight: "24px", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "700" }]
                    },
                    animation: {
                        "pulse-radar": "pulse-radar 2s cubic-bezier(0.4, 0, 0.6, 1) infinite",
                        "pulse-dot": "pulse-dot 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite",
                        "slide-up-fade": "slide-up-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards",
                        "scan-line": "scan-line 4s linear infinite"
                    },
                    keyframes: {
                        "pulse-radar": {
                            "0%": { transform: "scale(1)", opacity: "1", boxShadow: "0 0 0 0 rgba(5, 231, 119, 0.7)" },
                            "70%": { transform: "scale(1)", opacity: "0.8", boxShadow: "0 0 0 15px rgba(5, 231, 119, 0)" },
                            "100%": { transform: "scale(1)", opacity: "1", boxShadow: "0 0 0 0 rgba(5, 231, 119, 0)" }
                        },
                        "pulse-dot": {
                            "0%": { transform: "scale(0.8)", opacity: "1" },
                            "50%": { transform: "scale(1.2)", opacity: "0.5" },
                            "100%": { transform: "scale(0.8)", opacity: "1" }
                        },
                        "slide-up-fade": {
                            "0%": { transform: "translateY(20px) translateX(-50%)", opacity: "0" },
                            "100%": { transform: "translateY(0) translateX(-50%)", opacity: "1" }
                        },
                        "slide-up-fade-right": {
                            "0%": { transform: "translateY(20px)", opacity: "0" },
                            "100%": { transform: "translateY(0)", opacity: "1" }
                        },
                        "scan-line": {
                            "0%": { transform: "translateY(-100%)" },
                            "100%": { transform: "translateY(100vh)" }
                        }
                    }
                }
            }
        };
    </script>
    <style>
        /* Pulse Animation for Map Markers */
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(255, 86, 55, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(255, 86, 55, 0);
            }

            100% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(255, 86, 55, 0);
            }
        }

        /* Gamosa Pattern Overlay */
        .gamosa-pattern {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255, 86, 55, 0.1) 5px, rgba(255, 86, 55, 0.1) 10px);
        }

        /* Tactical Glow */
        .tactical-glow {
            box-shadow: 0 0 15px rgba(71, 214, 255, 0.2);
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(17, 19, 24, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (prefers-reduced-motion: reduce) {
            .marker-pulse,
            .animate-pulse-radar,
            .animate-pulse-dot,
            .animate-slide-up-fade,
            .animate-scan-line {
                animation: none !important;
                transform: none !important;
                opacity: 1 !important;
            }
        }

        /* Drawer state animations */
        .drawer-open {
            transform: translateX(0) !important;
        }

        .drawer-closed {
            transform: translateX(-100%) !important;
        }

        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background text-on-background font-body-md h-screen w-full overflow-hidden flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        function App() {
            // State management
            const [cases, setCases] = useState([]);
            const [floodZones, setFloodZones] = useState([]);
            const [camps, setCamps] = useState([]);
            const [riverGauges, setRiverGauges] = useState([]);
            const [riskPredictions, setRiskPredictions] = useState([]);
            const [hazardAlerts, setHazardAlerts] = useState([]);
            
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [activePage, setActivePage] = useState('map'); // 'map', 'queue', 'camps', 'audit', 'tele'

            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markersLayerRef = useRef(null);
            const zonesLayerRef = useRef(null);

            // API fetch base URLs
            const isLocalServe = window.location.origin.includes('localhost:8000') || window.location.origin.includes('127.0.0.1:8000');
            const API_BASE = isLocalServe ? '' : 'http://localhost:8000';

            const fetchData = async () => {
                try {
                    const [mapRes, campsRes, gaugesRes, predictionsRes, auditRes] = await Promise.all([
                        fetch(`${API_BASE}/api/map-data`).then(r => {
                            if (!r.ok) throw new Error('Failed to load map data');
                            return r.json();
                        }),
                        fetch(`${API_BASE}/api/camps`).then(r => {
                            if (!r.ok) throw new Error('Failed to load camps');
                            return r.json();
                        }),
                        fetch(`${API_BASE}/api/river-gauge-data`).then(r => {
                            if (!r.ok) throw new Error('Failed to load gauges');
                            return r.json();
                        }),
                        fetch(`${API_BASE}/api/flood-risk-prediction`).then(r => {
                            if (!r.ok) throw new Error('Failed to load risk prediction');
                            return r.json();
                        }),
                        fetch(`${API_BASE}/api/audit/summary`).then(r => {
                            if (!r.ok) return { hazard_alerts: [] };
                            return r.json();
                        }).catch(() => ({ hazard_alerts: [] }))
                    ]);

                    setCases(mapRes.cases?.features || []);
                    setFloodZones(mapRes.flood_zones?.features || []);
                    setCamps(campsRes.camps || []);
                    setRiverGauges(gaugesRes.stations || []);
                    setRiskPredictions(predictionsRes.predictions || []);
                    setHazardAlerts(auditRes.hazard_alerts || []);
                    setLoading(false);
                    setError(null);
                } catch (err) {
                    console.error("Fetch Error:", err);
                    setError(err.message || 'Error communicating with Sahayak API server');
                    setLoading(false);
                }
            };

            // Initial fetch + Auto-refresh every 10 seconds
            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 10000);
                return () => clearInterval(interval);
            }, []);

            // Dynamic Calculations for the Consolidated Header Stats
            const totalSOS = useMemo(() => cases.length, [cases]);
            
            const totalTrapped = useMemo(() => {
                return cases.reduce((sum, c) => sum + (c.properties?.victim_count || 1), 0);
            }, [cases]);

            const boatsDeployed = useMemo(() => {
                const t1 = cases.filter(c => c.properties?.tier === 'Tier 1').length;
                const t2 = cases.filter(c => c.properties?.tier === 'Tier 2').length;
                return Math.max(t1, Math.round((t1 + t2) * 0.6)) || 48; // default to 48 if 0
            }, [cases]);

            const basinStatus = useMemo(() => {
                const brahmaputraGauges = riverGauges.filter(g => g.river_name?.toLowerCase().includes('brahmaputra'));
                if (brahmaputraGauges.some(g => g.current_level_m >= g.danger_level_m)) return 'Danger';
                if (brahmaputraGauges.some(g => g.current_level_m >= g.warning_level_m)) return 'Warning';
                return 'Stable';
            }, [riverGauges]);

            const opsTempo = useMemo(() => {
                const t1Count = cases.filter(c => c.properties?.tier === 'Tier 1').length;
                if (t1Count > 5) return 'Extreme';
                if (t1Count > 0) return 'High';
                if (cases.length > 5) return 'Moderate';
                return 'Low';
            }, [cases]);

            const weatherStatus = useMemo(() => {
                const alertLevels = riskPredictions.map(p => p.rainfall_alert);
                if (alertLevels.includes('very_heavy')) return 'Heavy Rain';
                if (alertLevels.includes('heavy')) return 'Rain';
                return 'Clear';
            }, [riskPredictions]);

            const waterLevelTrend = useMemo(() => {
                const risingGauges = riverGauges.filter(g => g.trend === 'rising');
                if (riverGauges.length === 0) return 'STABLE';
                const pct = Math.round((risingGauges.length / riverGauges.length) * 100);
                return pct > 50 ? `RISING ${pct}%` : 'STABLE';
            }, [riverGauges]);

            // Leaflet Map logic
            useEffect(() => {
                if (activePage !== 'map' || loading || error || !mapRef.current) return;

                if (!mapInstanceRef.current) {
                    const map = L.map(mapRef.current, {
                        zoomControl: false,
                        attributionControl: false
                    }).setView([26.2, 92.8], 7.5);

                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                        maxZoom: 20
                    }).addTo(map);

                    L.control.zoom({ position: 'bottomright' }).addTo(map);

                    mapInstanceRef.current = map;
                    markersLayerRef.current = L.layerGroup().addTo(map);
                    zonesLayerRef.current = L.layerGroup().addTo(map);
                }

                const map = mapInstanceRef.current;
                const markersLayer = markersLayerRef.current;
                const zonesLayer = zonesLayerRef.current;

                markersLayer.clearLayers();
                zonesLayer.clearLayers();

                // Draw flood zonation polygons
                floodZones.forEach(zone => {
                    const type = zone.properties?.zone_type;
                    const color = type === 'red' ? '#E24B4A' : type === 'yellow' ? '#EF9F27' : '#639922';
                    const ringCoords = zone.geometry.coordinates[0].map(([lng, lat]) => [lat, lng]);

                    const poly = L.polygon(ringCoords, {
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.15,
                        weight: 1.5,
                        opacity: 0.8,
                        dashArray: '6, 4'
                    }).addTo(zonesLayer);

                    poly.bindTooltip(`
                        <div class="text-[11px] font-sans">
                            <strong style="color: ${color}; font-family: 'JetBrains Mono', monospace;">${zone.properties.label}</strong>
                            <br/><span style="color:#e2e2e8;">${zone.properties.depth}</span>
                        </div>
                    `, { sticky: true });
                });

                // Draw cases as numbered circle badges
                cases.forEach(c => {
                    const [lng, lat] = c.geometry.coordinates;
                    const p = c.properties;
                    const tier = p.tier || 'Tier 3';

                    const tierColor = tier === 'Tier 1' ? '#E24B4A' : tier === 'Tier 2' ? '#EF9F27' : '#639922';
                    const glowColor = tier === 'Tier 1' ? 'rgba(226,75,74,0.65)' : tier === 'Tier 2' ? 'rgba(239,159,39,0.5)' : 'rgba(99,153,34,0.4)';
                    const isT1 = tier === 'Tier 1';
                    
                    const victimCount = p.victim_count || 1;
                    const size = p.urgency_score >= 5 ? 28 : p.urgency_score === 4 ? 24 : 20;

                    const iconHtml = `
                        <div style="position:relative;width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;">
                            ${isT1 ? `<div class="absolute inset-0 rounded-full animate-ping" style="background:${tierColor};opacity:0.4;"></div>` : ''}
                            <div class="${isT1 ? 'animate-pulse-dot' : ''}" style="position:absolute;inset:0;border-radius:50%;background:${tierColor};border:2px solid rgba(255,255,255,0.7);box-shadow:0 0 10px ${glowColor};display:flex;align-items:center;justify-content:center;z-index:10;">
                                <span style="color:#ffffff;font-size:10px;font-weight:700;font-family:'Inter',sans-serif;text-shadow:0 1px 2px rgba(0,0,0,0.8);">${victimCount}</span>
                            </div>
                        </div>
                    `;

                    const icon = L.divIcon({
                        className: '',
                        html: iconHtml,
                        iconSize: [size, size],
                        iconAnchor: [size / 2, size / 2]
                    });

                    const marker = L.marker([lat, lng], { icon }).addTo(markersLayer);

                    marker.bindPopup(`
                        <div style="background:#0f1220;color:#e2e2e8;border-radius:10px;padding:12px;font-size:12px;font-family:'Inter',sans-serif;min-width:230px;border:1px solid ${tierColor}55;box-shadow: 0 4px 20px rgba(0,0,0,0.8);">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                                <span style="background:${tierColor};color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:0.04em;">
                                    ${tier.toUpperCase()}
                                </span>
                                <span style="color:#e2e2e8;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;">
                                    URGENCY: ${p.urgency_score}/5
                                </span>
                            </div>
                            <div style="font-weight:600;color:#ddd;margin-bottom:4px;">${p.gps_or_landmark}</div>
                            <div style="color:#999;font-size:11px;margin-bottom:6px;">Victim Count: <strong>${victimCount}</strong></div>
                            ${p.vulnerability_flags?.length ? `
                                <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;">
                                    ${p.vulnerability_flags.map(f => `<span style="background:rgba(239,159,39,0.15);color:#ffb4a5;font-size:8px;padding:1px 5px;border-radius:3px;font-weight:600;">${f}</span>`).join('')}
                                </div>
                            ` : ''}
                            <div style="color:#666;font-size:10px;border-top:1px solid rgba(255,255,255,0.05);padding-top:6px;">Asset: ${p.recommended_asset || 'Ground Vehicle'}</div>
                        </div>
                    `, { closeButton: false });
                });

                // Draw relief camps
                camps.forEach(camp => {
                    const isFull = camp.status === 'Full';
                    const statusColor = isFull ? '#E24B4A' : camp.status === 'Near Capacity' ? '#EF9F27' : '#639922';

                    const iconHtml = `
                        <div style="position:relative;width:30px;height:30px;display:flex;align-items:center;justify-content:center;">
                            <div style="position:absolute;inset:0;border-radius:8px;background:rgba(15,20,35,0.95);border:2px solid ${statusColor};box-shadow:0 0 10px ${statusColor}88;"></div>
                        </div>
                    `;

                    const icon = L.divIcon({
                        className: '',
                        html: iconHtml,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    const marker = L.marker([camp.lat, camp.lng], { icon }).addTo(markersLayer);

                    marker.bindPopup(`
                        <div style="background:#0f1220;color:#e2e2e8;border-radius:10px;padding:12px;font-size:12px;font-family:'Inter',sans-serif;min-width:210px;border:1px solid ${statusColor}55;box-shadow: 0 4px 20px rgba(0,0,0,0.8);">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                                <span style="background:${statusColor}22;color:${statusColor};border:1px solid ${statusColor}44;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;">
                                    CAMP STATUS
                                </span>
                                <span style="color:${statusColor};font-size:11px;font-weight:700;">
                                    ${camp.status}
                                </span>
                            </div>
                            <div style="font-weight:600;color:#ddd;margin-bottom:2px;">${camp.name}</div>
                            <div style="font-size:10px;color:#999;margin-bottom:6px;">${camp.district} District</div>
                            <div style="font-size:11px;color:#ddd;margin-bottom:4px;">Beds Occupied: ${camp.current_occupancy} / ${camp.capacity}</div>
                            <div style="height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;">
                                <div style="width:${Math.min(100, (camp.current_occupancy / camp.capacity) * 100)}%;height:100%;background:${statusColor};"></div>
                            </div>
                        </div>
                    `, { closeButton: false });
                });

            }, [activePage, loading, error, cases, floodZones, camps]);

            // Loading screen component
            if (loading) {
                return (
                    <div className="min-h-screen bg-[#0b1220] flex flex-col items-center justify-center gap-6 font-sans">
                        <div className="w-12 h-12 rounded-full border-[3px] border-primary/20 border-t-primary animate-spin"></div>
                        <div className="text-on-surface-variant font-mono text-[14px] tracking-widest text-[#999] uppercase animate-pulse">
                            Initializing Sahayak Command Console...
                        </div>
                    </div>
                );
            }

            // Error screen component
            if (error) {
                return (
                    <div className="min-h-screen bg-[#0b1220] flex flex-col items-center justify-center p-8 text-center font-sans">
                        <div className="text-error text-5xl mb-4">!</div>
                        <h2 className="text-[20px] font-bold text-error mb-2">Backend Connection Failed</h2>
                        <p className="text-on-surface-variant text-[13px] max-w-md text-[#999] mb-6">
                            Couldn't establish a link to the Sahayak API server. Ensure the backend FastAPI server is running.
                        </p>
                        <button onClick={fetchData} className="px-6 py-2.5 bg-primary/20 border border-primary/50 text-primary rounded flex items-center gap-2 font-mono text-label-caps hover:bg-primary/30 active:scale-95 transition-all">
                            <span className="material-symbols-outlined">refresh</span> RETRY CONNECTION
                        </button>
                    </div>
                );
            }

            // Derive a real 7-bucket SOS-severity distribution instead of hardcoded bar heights
            const severityBuckets = useMemo(() => {
                const buckets = [0, 0, 0, 0, 0]; // urgency scores 1..5
                cases.forEach(c => {
                    const score = Math.min(5, Math.max(1, c.properties?.urgency_score || 1));
                    buckets[score - 1]++;
                });
                const max = Math.max(...buckets, 1);
                return buckets.map(count => Math.round((count / max) * 100));
            }, [cases]);

            return (
                <div className="h-full w-full relative flex flex-col overflow-hidden">
                    {/* Navigation Drawer (Desktop Fixed / Mobile Slide-out) */}

                                                Emergency dialer and video bridge stand-by. Connect directly from active critical pins on the Map view.

                            )}
